<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MI German Talkie Patch · Review</title>
  <link rel="stylesheet" href="/patch-review/styles.css">
  <link rel="stylesheet" href="/wiki/help.css">
</head>
<body class="launcher-wizard" data-help-source="patch_review/app.js">
  <div class="wizard-shell">
  <header class="pr-header">
    <h1>MI German Talkie Patch</h1>
    <span id="pr-summary" class="muted">Lade Reviewdaten …</span>
    <nav id="pr-action-footer" class="pr-action-footer" aria-label="Nächster Schritt" hidden>
      <div id="pr-review-actions" class="pr-action-group">
        <button id="pr-back-render" type="button" hidden>Zurück zu Stimmen &amp; Rendern</button>
        <button id="pr-finish-global" class="primary" type="button" hidden>Patch fertigstellen</button>
      </div>
      <div id="pr-completion-actions" class="pr-action-group" hidden>
        <button id="pr-back-review" type="button">Zurück zur Review</button>
        <button id="pr-build-start" class="primary" type="button">Spielordner erstellen</button>
      </div>
      <div id="pr-success-actions" class="pr-action-group" hidden>
        <button id="pr-success-back-review" type="button">Zurück zur Review</button>
        <span class="pr-action-spacer"></span>
        <button id="pr-quit-app" type="button">Patch beenden</button>
        <button id="pr-open-output-quit" class="primary" type="button">Spielordner öffnen und Patch beenden</button>
      </div>
    </nav>
  </header>
  <main id="patch-review" class="pr-main"><p>Lade Dialoge …</p></main>
  </div>
  <script src="/patch-review/app.js" defer></script>
  <script src="/wiki/data.js" defer></script><script src="/wiki/help.js" defer></script><script src="/wiki/app-help.js" defer></script>
</body>
</html>
